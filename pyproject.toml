[project]
name = "atlas-commerce"
version = "0.1.0"
description = "Atlas Commerce regional recommendation prototype"
requires-python = ">=3.11,<3.13"
dependencies = ["pydantic>=2.0,<3", "neatlogs>=1.4.26,<2", "streamlit>=1.40,<2"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adaptive_commerce"]
